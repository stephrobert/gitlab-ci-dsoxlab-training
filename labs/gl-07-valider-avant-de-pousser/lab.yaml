# Lab gl-07-valider-avant-de-pousser. Les champs marqués REQUIS sont exigés par le validator :
# sans eux, le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: gl-07-valider-avant-de-pousser           # REQUIS
title: "Validate before you push"            # REQUIS
level: c1                     # REQUIS
description: "GitLab refuses the pipeline, and the refusal hides a second fault. A third one it accepts without complaint. Find all three without pushing to see, then prove the pipeline runs. Graded on the configuration GitLab accepted and on the jobs that ran."
skills:                       # REQUIS, non vide
  - gitlab-ci
  - validation
  - debug
  - stages
distros:                      # REQUIS, non vide
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/pipeline-cicd/gitlab/labs/lab-07-valider-pipeline/   # REQUIS, http(s)
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  # L'apprenant ouvre lui-même sa session : une forge se manipule depuis sa
  # propre machine, pas depuis un shell injecté.
  session: local
  targets:                    # REQUIS pour vm, non vide
    - name: gitlab
      host: gitlab-1.lab      # doit exister dans meta.yml: infra.hosts[]
      label_en: "Ubuntu 24.04, GitLab CE and its runner"
      label_fr: "Ubuntu 24.04, GitLab CE et son runner"
  default: gitlab
validation:
  functional: true
  persistence_after_reboot: false
