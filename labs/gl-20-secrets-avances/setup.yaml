---
# Joue par `dsoxlab run` : il pose un pipeline VERT qui consomme deux secrets
# mal geres, et rien d autre. Le jeton de service est une variable ni masquee
# ni protegee ; la cle de deploiement est
# une variable ordinaire, que le job ecrit dans un fichier a la main.
#
# Le socle installe GitLab CE, son runner et le registre, et il est
# idempotent : apres les labs precedents, il ne reinstalle rien.
#
# ECRITURE : ce fichier ne contient AUCUNE apostrophe isolee, et aucune
# longueur de variable shell du genre dollar-accolade-diese. Les deux font
# refuser le playbook au chargement (voir _commun/depot.yaml).
- name: Socle commun du catalogue
  ansible.builtin.import_playbook: ../_commun/socle.yaml

- name: Preparer le lab gl-20-secrets-avances
  hosts: lab_target
  become: true
  gather_facts: false
  vars:
    projet: "pipeline-craft"
    gitlab_url: "http://gitlab-1.lab"
    travail: "/opt/dsoxlab/gl-20"
    bundle_cible: "/opt/dsoxlab/pipeline-craft.bundle"
    # Les faits que les tests relisent : l identifiant du jeton de depart, et
    # le dernier pipeline qui precede le travail de l apprenant. Ils vivent hors
    # de la copie de travail, que l apprenant peut reecrire.
    etat: "/var/lib/dsoxlab/gl-20"

  tasks:
    # La copie de travail est testee AVANT le depot commun : c est elle qui dit
    # si le lab est joue pour la premiere fois ou rejoue. Les secrets et le
    # pipeline ne sont poses que sur une copie neuve, jamais par-dessus le
    # travail de l apprenant.
    - name: La copie de travail existe-t-elle deja ?
      ansible.builtin.stat:
        path: "{{ travail }}/{{ projet }}/.git"
      register: copie_gl20

    - name: Le repertoire des faits du lab
      ansible.builtin.file:
        path: "{{ etat }}"
        state: directory
        mode: "0755"

    # Le depot commun pousse `main` EN FORCE. Si un lab precedent, ou ce lab
    # rejoue sans nettoyage, a laisse la branche protegee, le push serait
    # refuse. On leve donc la protection avant, et on la repose apres.
    - name: Lever la protection de main d une eventuelle execution precedente
      ansible.builtin.shell: |
        set -o pipefail
        JETON=$(cat /etc/dsoxlab/jeton-api)
        API="$URL/api/v4"
        H="PRIVATE-TOKEN: $JETON"
        ID=$(curl -sS --header "$H" "$API/projects/root%2F$PROJET" | jq -r '.id // empty')
        if test -n "$ID"; then
          curl -sS -o /dev/null --header "$H" --request DELETE "$API/projects/$ID/protected_branches/main"
        fi
        exit 0
      args:
        executable: /bin/bash
      environment:
        PROJET: "{{ projet }}"
        URL: "{{ gitlab_url }}"
      changed_when: false
      when: not copie_gl20.stat.exists

    - name: Le projet du lab dans la forge
      ansible.builtin.include_tasks: ../_commun/depot.yaml
      vars:
        branche_source: "main"
        exiger_absence_pipeline: "{{ not copie_gl20.stat.exists }}"
        effacer_pipelines: "{{ not copie_gl20.stat.exists }}"
        attendre_pipeline_depart: false
        adapter_registre_local: false

    # TOUT CE QUI EST SECRET, ET LA PROTECTION DE LA BRANCHE. Une variable
    # protegee n est remise qu aux pipelines des branches protegees : sans
    # `main` protegee, le geste de l apprenant casserait son propre pipeline.
    # La branche est donc protegee ici, en etat de depart, et ce n est pas ce
    # que le lab note.
    #
    # Le jeton de service est un VRAI jeton d acces de projet (portee read_api),
    # parce qu un secret a renouveler doit etre accepte ou refuse par un
    # service : ici, la forge elle-meme. Le job l utilise pour appeler son API.
    # La cle de deploiement est une cle SSH fabriquee ici, qui n ouvre rien.
    - name: Poser la protection de main, le jeton de service et la cle
      ansible.builtin.shell: |
        set -o pipefail
        JETON=$(cat /etc/dsoxlab/jeton-api)
        API="$URL/api/v4"
        H="PRIVATE-TOKEN: $JETON"
        ID=$(curl -sS --header "$H" "$API/projects/root%2F$PROJET" | jq -r '.id // empty')
        test -n "$ID"
        TMP=$(mktemp -d)
        chmod 0700 "$TMP"
        trap 'rm -rf "$TMP"' EXIT

        curl -sS -o /dev/null --header "$H" --request DELETE "$API/projects/$ID/protected_branches/main"
        CODE=$(curl -sS -o "$TMP/pb.json" -w "%{http_code}" --header "$H" --request POST \
          --data "name=main" --data "push_access_level=40" --data "merge_access_level=40" \
          --data "allow_force_push=false" "$API/projects/$ID/protected_branches")
        test "$CODE" = "201" || { echo "protection de main refusee : HTTP $CODE"; head -c 300 "$TMP/pb.json"; exit 1; }

        for TID in $(curl -sS --header "$H" "$API/projects/$ID/access_tokens" \
          | jq -r '.[]? | select(.active == true) | .id'); do
          curl -sS -o /dev/null --header "$H" --request DELETE "$API/projects/$ID/access_tokens/$TID"
        done
        EXP=$(date -d "+30 days" +%F)
        CODE=$(curl -sS -o "$TMP/tok.json" -w "%{http_code}" --header "$H" --request POST \
          --data "name=service-v1" --data "scopes[]=read_api" --data "access_level=20" \
          --data "expires_at=$EXP" "$API/projects/$ID/access_tokens")
        test "$CODE" = "201" || { echo "jeton refuse : HTTP $CODE"; head -c 300 "$TMP/tok.json"; exit 1; }
        printf "%s" "$(jq -r .token "$TMP/tok.json")" > "$TMP/service-token"
        jq -r .id "$TMP/tok.json" > "$ETAT/ancien-jeton-id"
        chmod 0644 "$ETAT/ancien-jeton-id"

        ssh-keygen -q -t ed25519 -N "" -C "deploy@lab" -f "$TMP/deploy-key"

        poser() {
          NOM="$1"
          FICHIER="$2"
          CODE=$(curl -sS -o "$TMP/var.json" -w "%{http_code}" --header "$H" \
            --request PUT --data-urlencode "value@$FICHIER" \
            --data "masked=false" --data "protected=false" \
            --data "variable_type=env_var" --data "raw=true" \
            "$API/projects/$ID/variables/$NOM")
          if [ "$CODE" = "404" ]; then
            CODE=$(curl -sS -o "$TMP/var.json" -w "%{http_code}" --header "$H" \
              --request POST --data "key=$NOM" --data-urlencode "value@$FICHIER" \
              --data "masked=false" --data "protected=false" \
              --data "variable_type=env_var" --data "raw=true" \
              "$API/projects/$ID/variables")
          fi
          case "$CODE" in
            200|201) echo "variable $NOM posee" ;;
            *) echo "variable $NOM refusee : HTTP $CODE"; head -c 300 "$TMP/var.json"; exit 1 ;;
          esac
        }
        poser SERVICE_TOKEN "$TMP/service-token"
        poser DEPLOY_KEY "$TMP/deploy-key"
      args:
        executable: /bin/bash
      environment:
        PROJET: "{{ projet }}"
        URL: "{{ gitlab_url }}"
        ETAT: "{{ etat }}"
      changed_when: true
      no_log: true
      when: not copie_gl20.stat.exists

    # LE PIPELINE DE DEPART : deux jobs, qui marchent, et qui font chacun la
    # faute que le lab corrige. Le premier s en sert pour appeler la forge (le
    # runner masque de lui-meme tout jeton glpat- dans les journaux, donc la fuite
    # au journal n est PAS le sujet de ce lab : c est celui de gl-05). Le second ecrit la cle dans un fichier a
    # la main, ce qui suppose une variable ordinaire.
    #
    # Le YAML est ecrit avec des scalaires en bloc : un `: ` dans un scalaire
    # simple (l en-tete PRIVATE-TOKEN) casserait la lecture.
    - name: Un pipeline qui marche, avec deux secrets mal geres
      ansible.builtin.copy:
        dest: "{{ travail }}/{{ projet }}/.gitlab-ci.yml"
        mode: "0644"
        content: |
          stages:
            - secrets

          default:
            image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6

          joindre-le-service:
            stage: secrets
            script:
              - |
                wget -q -O /dev/null --header "PRIVATE-TOKEN: $SERVICE_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID"
              - echo "SERVICE-JOINT"

          installer-la-cle:
            stage: secrets
            script:
              - printf "%s\n" "$DEPLOY_KEY" > cle.pem
              - chmod 600 cle.pem
              - grep -q "BEGIN OPENSSH PRIVATE KEY" cle.pem
              - if [ -f "$DEPLOY_KEY" ]; then echo "CLE-SOURCE=fichier"; else echo "CLE-SOURCE=valeur"; fi
              - echo "CLE-INSTALLEE"
      when: not copie_gl20.stat.exists

    # Pas de push force : le depot commun vient de pousser `main`, ce commit
    # s y ajoute. La branche est protegee mais accepte les Maintainers.
    - name: Pousser le pipeline dans la forge
      ansible.builtin.shell: |
        set -o pipefail
        cd "$TRAVAIL/$PROJET"
        JETON=$(cat /etc/dsoxlab/jeton-api)
        AUTH="oauth2:$JETON"
        git add -A
        git diff --cached --quiet || git commit -q -m "feat: un pipeline qui appelle un service et installe une cle"
        git push -q "http://$AUTH@gitlab-1.lab/root/$PROJET.git" main
      args:
        executable: /bin/bash
      environment:
        TRAVAIL: "{{ travail }}"
        PROJET: "{{ projet }}"
      when: not copie_gl20.stat.exists
      changed_when: true
      no_log: true

    # Le pipeline de depart doit etre TERMINE et SAIN avant de rendre la main :
    # `manual` ne se presente pas ici (aucun job manuel), donc `success`.
    - name: Attendre le pipeline du dernier commit de main
      ansible.builtin.shell: |
        set -o pipefail
        JETON=$(cat /etc/dsoxlab/jeton-api)
        API="$URL/api/v4"
        H="PRIVATE-TOKEN: $JETON"
        ID=$(curl -sS --header "$H" "$API/projects/root%2F$PROJET" | jq -r '.id // empty')
        test -n "$ID"
        SHA=$(curl -sS --header "$H" "$API/projects/$ID/repository/branches/main" | jq -r '.commit.id // empty')
        test -n "$SHA"
        ETAT=$(curl -sS --header "$H" "$API/projects/$ID/pipelines?ref=main&sha=$SHA&per_page=1" | jq -r '.[0].status // "aucun"')
        echo "$ETAT"
        case "$ETAT" in
          success|failed|canceled|skipped|manual) exit 0 ;;
          *) exit 1 ;;
        esac
      args:
        executable: /bin/bash
      environment:
        PROJET: "{{ projet }}"
        URL: "{{ gitlab_url }}"
      register: pipeline_depart
      until: pipeline_depart.rc == 0
      retries: 40
      delay: 10
      changed_when: false

    # LE SETUP MESURE SON PROPRE ETAT DE DEPART, dans la forge et non dans ses
    # propres fichiers : le pipeline est sain, le jeton est valide, et aucune des deux variables n est protegee.
    - name: Mesurer l etat de depart
      ansible.builtin.shell: |
        set -o pipefail
        DIAG="/var/tmp/gl-20-diagnostic-depart.txt"
        mkdir -p "$ETAT"
        : > "$DIAG"
        chmod 0644 "$DIAG"
        # no_log masque la sortie : chaque echec ecrit sa cause dans ce fichier
        # (jamais la valeur du jeton).
        echec() { echo "$*" >> "$DIAG"; exit 1; }
        JETON=$(cat /etc/dsoxlab/jeton-api)
        API="$URL/api/v4"
        H="PRIVATE-TOKEN: $JETON"
        ID=$(curl -sS --header "$H" "$API/projects/root%2F$PROJET" | jq -r '.id // empty')
        test -n "$ID" || echec "projet introuvable"
        SHA=$(curl -sS --header "$H" "$API/projects/$ID/repository/branches/main" | jq -r '.commit.id // empty')
        PL=$(curl -sS --header "$H" "$API/projects/$ID/pipelines?ref=main&sha=$SHA&per_page=1" | jq -r '.[0].id // empty')
        test -n "$PL" || echec "aucun pipeline sur le SHA de main ($SHA)"
        ETAT_PL=$(curl -sS --header "$H" "$API/projects/$ID/pipelines/$PL" | jq -r .status)
        if [ "$ETAT_PL" != "success" ]; then
          echo "le pipeline de depart est $ETAT_PL : il devrait etre vert" >> "$DIAG"
          curl -sS --header "$H" "$API/projects/$ID/pipelines/$PL/jobs" | jq -r '.[] | "  \(.name) \(.status)"' >> "$DIAG"
          exit 1
        fi
        VAL=$(curl -sS --header "$H" "$API/projects/$ID/variables/SERVICE_TOKEN" | jq -r '.value // empty')
        test -n "$VAL" || echec "SERVICE_TOKEN sans valeur"
        for NOM in SERVICE_TOKEN DEPLOY_KEY; do
          REP=$(curl -sS --header "$H" "$API/projects/$ID/variables/$NOM")
          if [ "$(echo "$REP" | jq -r .protected)" != "false" ] || [ "$(echo "$REP" | jq -r .masked)" != "false" ]; then
            echo "$NOM devrait etre ni protegee ni masquee au depart" >> "$DIAG"
            exit 1
          fi
        done
        if [ "$(curl -sS --header "$H" "$API/projects/$ID/variables/DEPLOY_KEY" | jq -r .variable_type)" != "env_var" ]; then
          echo "DEPLOY_KEY devrait etre une variable ordinaire au depart" >> "$DIAG"
          exit 1
        fi
        echo "$PL" > "$ETAT/depart-pipeline"
        chmod 0644 "$ETAT/depart-pipeline"
        echo "etat de depart : pipeline $PL vert, deux variables ni protegees ni masquees"
      args:
        executable: /bin/bash
      environment:
        PROJET: "{{ projet }}"
        URL: "{{ gitlab_url }}"
        ETAT: "{{ etat }}"
      changed_when: false
      no_log: true
      when: not copie_gl20.stat.exists

    - name: Les faits de la situation
      ansible.builtin.copy:
        dest: "{{ travail }}/NOTE-SECRETS.txt"
        mode: "0644"
        content: |
          Ce que la situation vous donne deja.

          Le projet pipeline-craft porte deux variables CI/CD :

            - SERVICE_TOKEN : un jeton d acces de projet, nomme service-v1
              (portee read_api). Le job joindre-le-service s en sert pour
              appeler l API de la forge ;
            - DEPLOY_KEY : une cle SSH de deploiement (plusieurs lignes). Le
              job installer-la-cle l installe dans un fichier.

          La branche main est protegee. Un jeton d acces de projet se gere sous
          Settings > Access tokens, ou par l API :

            - POST   /projects/:id/access_tokens        cree un jeton ;
            - DELETE /projects/:id/access_tokens/:id    le revoque ;
            - POST   /projects/:id/access_tokens/:id/rotate  cree le suivant ET
              revoque l ancien dans le meme geste.

          Un jeton personnel de la VM, root, est lisible dans
          /etc/dsoxlab/jeton-api : il sert a appeler l API depuis la machine
          sans jamais l ecrire sur une ligne de commande.

          Les deux jobs doivent rester verts, sous le meme nom.
