---
# Joué par `dsoxlab run` : il pose un pipeline cassé avant d'avoir commencé,
# puis fragile une fois réparé.
#
# Le socle installe GitLab CE, son runner et le registre, et il est
# idempotent : après les labs précédents, il ne réinstalle rien.
- name: Socle commun du catalogue
  ansible.builtin.import_playbook: ../_commun/socle.yaml

- name: Preparer le lab gl-18-fiabiliser-sans-masquer
  hosts: lab_target
  become: true
  gather_facts: false
  vars:
    projet: "pipeline-craft"
    gitlab_url: "http://gitlab-1.lab"
    travail: "/opt/dsoxlab/gl-18"
    bundle_cible: "/opt/dsoxlab/pipeline-craft.bundle"

  tasks:
    # `starter/lab-18` porte DEUX defauts, et c'est voulu.
    #
    # LE PREMIER EMPECHE TOUT LE RESTE : les deux jobs de `ci/orchestration.yml`
    # sont ranges en `stage: orchestrate`, que le `stages:` du fichier principal
    # ne declare pas. Mesure le 2026-10-22 sur l'instance du lab : GitLab refuse
    # la configuration entiere (« chosen stage orchestrate does not exist »), le
    # pipeline nait `failed` AVEC ZERO JOB, et le champ `yaml_errors` du
    # pipeline rend `null`. Rien, dans l'interface du pipeline, ne dit pourquoi.
    #
    # LE SECOND EST LA FRAGILITE : aucun job ne porte de `retry`, aucun ne porte
    # de `timeout`, aucun deploiement ne porte de verrou, et le `default:`
    # global rend tous les jobs interruptibles, deploiements compris.
    - name: Le projet du lab dans la forge
      ansible.builtin.include_tasks: ../_commun/depot.yaml
      vars:
        branche_source: "starter/lab-18"
        exiger_absence_pipeline: false
        effacer_pipelines: false
        attendre_pipeline_depart: true
        adapter_registre_local: true

    # L'ETAT DE DEPART SE MESURE, IL NE SE SUPPOSE PAS. Si le depot amont
    # corrigeait un jour son etape manquante, le lab perdrait sa premiere
    # moitie sans que rien ne le dise. Le linter est interroge ici meme, et il
    # doit REFUSER la configuration : c'est la situation du scenario.
    - name: GitLab doit refuser la configuration de depart
      ansible.builtin.shell: |
        set -o pipefail
        JETON=$(cat /etc/dsoxlab/jeton-api)
        API="$URL/api/v4"
        H="PRIVATE-TOKEN: $JETON"
        ID=$(curl -sS --header "$H" "$API/projects/root%2F$PROJET" | jq -r '.id // empty')
        test -n "$ID"
        REP=$(curl -sS --header "$H" "$API/projects/$ID/ci/lint?dry_run=true&ref=main")
        echo "$REP" | jq -r '.errors[]? | "  " + .'
        if echo "$REP" | jq -e '.valid == true' >/dev/null; then
          echo "la configuration de depart est VALIDE : le depot amont a change"
          exit 1
        fi
        if ! echo "$REP" | jq -e '[.errors[]? | select(test("stage"))] | length > 0' >/dev/null; then
          echo "la configuration est refusee, mais pas pour l etape manquante"
          exit 1
        fi
      args:
        executable: /bin/bash
      environment:
        PROJET: "{{ projet }}"
        URL: "{{ gitlab_url }}"
      changed_when: false

    # Un verrou laisse par un passage precedent ferait demarrer le lab a moitie
    # fait : les groupes de ressources sont exactement ce que les tests
    # comptent. Ils partent avec le projet, mais le lab se rejoue aussi sans
    # suppression du projet, et le controle doit alors parler.
    - name: Aucun verrou de deploiement ne doit preexister
      ansible.builtin.shell: |
        set -o pipefail
        JETON=$(cat /etc/dsoxlab/jeton-api)
        API="$URL/api/v4"
        H="PRIVATE-TOKEN: $JETON"
        ID=$(curl -sS --header "$H" "$API/projects/root%2F$PROJET" | jq -r '.id // empty')
        N=$(curl -sS --header "$H" "$API/projects/$ID/resource_groups" | jq '[.[]?] | length')
        echo "$N verrou(s) de deploiement sur le projet"
        test "$N" -eq 0
      args:
        executable: /bin/bash
      environment:
        PROJET: "{{ projet }}"
        URL: "{{ gitlab_url }}"
      changed_when: false
