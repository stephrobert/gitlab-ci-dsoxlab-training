---
# Joué par `dsoxlab clean` : il remet la situation du scénario, pour que le lab
# se rejoue à l'identique. Tout le travail vit dans `_commun/nettoyer.yaml`, et
# les verrous de déploiement partent avec le projet qui les porte.
- name: Nettoyer le lab gl-18-fiabiliser-sans-masquer
  hosts: lab_target
  become: true
  gather_facts: false
  vars:
    projet: "pipeline-craft"
    gitlab_url: "http://gitlab-1.lab"
    travail: "/opt/dsoxlab/gl-18"

  tasks:
    - name: Le projet et la copie de travail partent
      ansible.builtin.include_tasks: ../_commun/nettoyer.yaml
