title: Signer l'image, et refuser celles qui ne le sont pas
description: "Un pipeline publie son image sans rien en dire, et une image non signée dort dans le même registre. Inventoriez l'image avec Syft (SBOM CycloneDX gardé en artefact), signez-la par son digest avec cosign, attachez une attestation de provenance signée, puis ajoutez un job de vérification qui échoue sur une image non signée avant le déploiement, et prouvez-le. Noté sur ce que la forge et le registre ont vu : l'artefact SBOM, une signature et une attestation que cosign vérifie lui-même, et un pipeline réellement échoué sur l'image non signée."
