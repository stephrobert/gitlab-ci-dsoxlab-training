---
# Joué par `dsoxlab clean` : il remet la situation du scénario, pour que le lab
# se rejoue à l'identique.
#
# Tout le travail vit dans `_commun/nettoyer.yaml`, que les labs partagent. Il
# retire les images du registre AVANT de supprimer le projet, GitLab refusant
# de supprimer un projet qui porte des tags.
- name: Nettoyer le lab gl-09-publier-au-registre
  hosts: lab_target
  become: true
  gather_facts: false
  vars:
    projet: "pipeline-craft"
    gitlab_url: "http://gitlab-1.lab"
    travail: "/opt/dsoxlab/gl-09"

  tasks:
    - name: Le projet et la copie de travail partent
      ansible.builtin.include_tasks: ../_commun/nettoyer.yaml
