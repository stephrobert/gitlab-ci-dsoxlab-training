id: gl-04-artifacts-et-cache
title: "Mettre les dépendances en cache, garder le rapport de tests"
description: "Le pipeline est vert mais gaspilleur : chaque job retélécharge ses dépendances, et les résultats de tests disparaissent avec le job. Ajouter un cache dont la clé suit le fichier de dépendances, et publier le rapport JUnit pour que GitLab le lise. La note porte sur les journaux et le rapport de tests du pipeline."
