---
# Joué par `dsoxlab run` : il pose un pipeline qui marche, mais qui recommence
# tout à chaque passage et ne laisse aucune trace exploitable de ses tests.
#
# Le socle installe GitLab CE et son runner, et il est idempotent : après les
# labs précédents, il ne réinstalle rien. `_commun/depot.yaml` pose le projet
# et son contenu, avec la branche de départ pour seule variable.
- name: Socle commun du catalogue
  ansible.builtin.import_playbook: ../_commun/socle.yaml

- name: Preparer le lab gl-04-artifacts-et-cache
  hosts: lab_target
  become: true
  gather_facts: false
  vars:
    projet: "pipeline-craft"
    gitlab_url: "http://gitlab-1.lab"
    travail: "/opt/dsoxlab/gl-04"
    bundle_cible: "/opt/dsoxlab/pipeline-craft.bundle"

  tasks:
    # `starter/lab-04` est l'état d'arrivée du lab 03 : un pipeline VERT, avec
    # la bonne image par job et un démon pour la construction. Rien n'est cassé
    # ici, et c'est le sujet : un pipeline qui marche peut quand même
    # retélécharger ses dépendances à chaque job et jeter ses résultats de
    # tests.
    #
    # On garde donc le pipeline de départ et on attend qu'il finisse :
    # l'apprenant doit pouvoir comparer les durées avant et après.
    - name: Le projet du lab dans la forge
      ansible.builtin.include_tasks: ../_commun/depot.yaml
      vars:
        branche_source: "starter/lab-04"
        exiger_absence_pipeline: false
        effacer_pipelines: false
        attendre_pipeline_depart: true
