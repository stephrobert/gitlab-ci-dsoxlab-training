# Lab gl-04-artifacts-et-cache. Les champs marqués REQUIS sont exigés par le validator : sans eux,
# le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: gl-04-artifacts-et-cache                 # REQUIS
title: "Cache the dependencies, keep the test report"   # REQUIS
level: c1                     # REQUIS
description: "The pipeline is green but wasteful: every job downloads its dependencies again, and the test results vanish with the job. Add a cache keyed on the dependency file, and publish the JUnit report so GitLab reads it. Graded on the job logs and the pipeline test report."
skills:                       # REQUIS, non vide
  - gitlab-ci
  - cache
  - artifacts
  - reports
distros:                      # REQUIS, non vide
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/pipeline-cicd/gitlab/fondamentaux/artifacts-cache/   # REQUIS, http(s)
lab_type: lab
estimated_time: 40m
# Certification GitLab Certified CI/CD Associate. Objectifs releves sur
# university.gitlab.com le 2026-10-22, recopies verbatim :
# - objectif 1 : « Create and configure .gitlab-ci.yml files with proper YAML
#   syntax, variables, artifacts, and caching strategies »
# Cache cle sur le fichier de dependances, rapport JUnit publie en
# artifacts:reports et lu par GitLab.
certification_tags:
  - gl-cicd-associate

runtime:
  type: vm
  # L'apprenant ouvre lui-même sa session : une forge se manipule depuis sa
  # propre machine, pas depuis un shell injecté.
  session: local
  targets:                    # REQUIS pour vm, non vide
    - name: gitlab
      host: gitlab-1.lab      # doit exister dans meta.yml: infra.hosts[]
      label_en: "Ubuntu 24.04, GitLab CE and its runner"
      label_fr: "Ubuntu 24.04, GitLab CE et son runner"
  default: gitlab
validation:
  functional: true
  persistence_after_reboot: false
