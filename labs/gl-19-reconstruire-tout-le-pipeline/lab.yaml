# Lab gl-19-reconstruire-tout-le-pipeline. Les champs marqués REQUIS sont exigés par le
# validator : sans eux, le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: gl-19-reconstruire-tout-le-pipeline      # REQUIS
title: "Rebuild the whole pipeline"          # REQUIS
level: c3                     # REQUIS
description: "The repository has no pipeline at all: not a single CI file. Rebuild one that lints, tests on a matrix with reported results, triggers a dynamic child pipeline, publishes the image to the registry and deploys safely, in five stages and several included files. No step-by-step guide: a specification, and the state the forge has to show at the end."
skills:                       # REQUIS, non vide
  - gitlab-ci
  - include
  - matrix
  - parent-child-pipelines
  - container-registry
  - reliability
distros:                      # REQUIS, non vide
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/pipeline-cicd/gitlab/industrialisation/capstone/   # REQUIS, http(s)
# `capstone`, et non `lab` : ce travail part d'un depot sans aucun fichier de
# CI, avec un cahier des charges pour seul enonce, et il tient l'epreuve de fin
# du niveau c3 du parcours `gitlab-ci`. La declaration compte : le controle
# `check:niveaux` du site refuse qu'un niveau soit valide par un `lab`, et il a
# raison de le faire. Les indices restent en place, comme pour les capstones de
# certification (cka, ckad, cks) : un capstone n'est pas un challenge.
lab_type: capstone
estimated_time: 90m
# Certification GitLab Certified CI/CD Associate. Objectifs releves sur
# university.gitlab.com le 2026-10-22, recopies verbatim :
# - objectif 1 : « Create and configure .gitlab-ci.yml files with proper YAML
#   syntax, variables, artifacts, and caching strategies »
# - objectif 3 : « Build and manage container images and packages using
#   GitLab's integrated registries »
# - objectif 6 : « pipeline development with stages, jobs, and DAG
#   architectures »
# Capstone : cinq etapes, matrice avec rapports, enfant dynamique et image
# publiee au registre, sur specification et sans pas-a-pas.
certification_tags:
  - gl-cicd-associate

runtime:
  type: vm
  # L'apprenant ouvre lui-même sa session : une forge se manipule depuis sa
  # propre machine, pas depuis un shell injecté.
  session: local
  targets:                    # REQUIS pour vm, non vide
    - name: gitlab
      host: gitlab-1.lab      # doit exister dans meta.yml: infra.hosts[]
      label_en: "Ubuntu 24.04, GitLab CE and its runner"
      label_fr: "Ubuntu 24.04, GitLab CE et son runner"
  default: gitlab
validation:
  functional: true
  persistence_after_reboot: false
