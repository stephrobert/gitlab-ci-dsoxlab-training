---
# Joué par `dsoxlab clean` : il remet la situation du scénario, pour que
# l'épreuve se rejoue à l'identique. Tout le travail vit dans
# `_commun/nettoyer.yaml`, qui retire d'abord les étiquettes du registre, sans
# quoi GitLab refuse de supprimer le projet qui les porte.
- name: Nettoyer le lab gl-19-reconstruire-tout-le-pipeline
  hosts: lab_target
  become: true
  gather_facts: false
  vars:
    projet: "pipeline-craft"
    gitlab_url: "http://gitlab-1.lab"
    travail: "/opt/dsoxlab/gl-19"

  tasks:
    - name: Le projet et la copie de travail partent
      ansible.builtin.include_tasks: ../_commun/nettoyer.yaml
