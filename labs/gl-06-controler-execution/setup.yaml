---
# Joué par `dsoxlab run` : il pose un pipeline qui tourne **tout le temps et
# pour tout le monde**, et ne déploie rien.
#
# Le socle installe GitLab CE, son runner et le registre, et il est
# idempotent : après les labs précédents, il ne réinstalle rien.
# `_commun/depot.yaml` pose le projet et son contenu, avec la branche de départ
# pour seule variable.
- name: Socle commun du catalogue
  ansible.builtin.import_playbook: ../_commun/socle.yaml

- name: Preparer le lab gl-06-controler-execution
  hosts: lab_target
  become: true
  gather_facts: false
  vars:
    projet: "pipeline-craft"
    gitlab_url: "http://gitlab-1.lab"
    travail: "/opt/dsoxlab/gl-06"
    bundle_cible: "/opt/dsoxlab/pipeline-craft.bundle"

  tasks:
    # `starter/lab-06` porte un pipeline complet, vert, mais sans aucune règle :
    # tous ses jobs tournent à chaque push, sur n'importe quelle branche, et
    # rien n'est déployé.
    #
    # `adapter_registre_local` dit au service Docker que le registre du lab est
    # en clair : la forge est en HTTP, et un démon refuse par défaut un
    # registre qui n'est pas en TLS. Sans cette adaptation, le job de
    # construction échouerait pour une raison étrangère au sujet du lab.
    - name: Le projet du lab dans la forge
      ansible.builtin.include_tasks: ../_commun/depot.yaml
      vars:
        branche_source: "starter/lab-06"
        exiger_absence_pipeline: false
        effacer_pipelines: false
        attendre_pipeline_depart: true
        adapter_registre_local: true
