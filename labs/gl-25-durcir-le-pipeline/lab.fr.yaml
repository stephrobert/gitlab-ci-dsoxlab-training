title: Durcir le runner, et fermer ce qui était grand ouvert
description: 'Un pipeline tourne sur un runner grand ouvert : ses jobs sont privilégiés, n''importe quelle image y tourne et le conteneur garde toutes les capacités Linux. Le pipeline rejoue deux attaques contre ce runner, et les deux réussissent. Durcissez la configuration du runner (plus de mode privilégié, une liste d''images autorisées, capacités retirées), relancez le pipeline et prouvez que les deux attaques sont bloquées alors que le job légitime passe encore. Noté sur la configuration du runner et sur ce que montrent les journaux des jobs, jamais sur un fichier du dépôt. Docker-in-Docker ne fonctionne plus sur un runner durci : le lab le dit et ne pratique pas le contournement.'
