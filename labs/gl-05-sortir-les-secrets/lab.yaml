# Lab gl-05-sortir-les-secrets. Les champs marqués REQUIS sont exigés par le validator : sans eux,
# le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: gl-05-sortir-les-secrets                 # REQUIS
title: "Get the secret out of the repository"           # REQUIS
level: c1                     # REQUIS
description: "A database password sits in plain text in two places, and a job prints it in its log. Take it out of the repository, declare it as a masked and protected CI/CD variable, and prove it no longer leaks. Graded on the repository, the variables and the job logs."
skills:                       # REQUIS, non vide
  - gitlab-ci
  - secrets
  - variables
  - securite
distros:                      # REQUIS, non vide
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/pipeline-cicd/gitlab/labs/lab-05-sortir-les-secrets/   # REQUIS, http(s)
lab_type: lab
estimated_time: 30m
runtime:
  type: vm
  # L'apprenant ouvre lui-même sa session : une forge se manipule depuis sa
  # propre machine, pas depuis un shell injecté.
  session: local
  targets:                    # REQUIS pour vm, non vide
    - name: gitlab
      host: gitlab-1.lab      # doit exister dans meta.yml: infra.hosts[]
      label_en: "Ubuntu 24.04, GitLab CE and its runner"
      label_fr: "Ubuntu 24.04, GitLab CE et son runner"
  default: gitlab
validation:
  functional: true
  persistence_after_reboot: false
