---
# Joué par `dsoxlab run` : il pose un pipeline qui ne sait naître que d'un
# push, et un projet sans aucun déclencheur.
#
# Le socle installe GitLab CE, son runner et le registre, et il est
# idempotent : après les labs précédents, il ne réinstalle rien.
- name: Socle commun du catalogue
  ansible.builtin.import_playbook: ../_commun/socle.yaml

- name: Preparer le lab gl-08-declencher-autrement
  hosts: lab_target
  become: true
  gather_facts: false
  vars:
    projet: "pipeline-craft"
    gitlab_url: "http://gitlab-1.lab"
    travail: "/opt/dsoxlab/gl-08"
    bundle_cible: "/opt/dsoxlab/pipeline-craft.bundle"

  tasks:
    # `starter/lab-08` porte un `workflow:` qui n'accepte que trois sources :
    # une demande de fusion, la branche par défaut, une étiquette. Un pipeline
    # lancé par l'API, par un jeton de déclenchement ou par une planification
    # ne naît donc pas du tout, et aucun message ne le dit : il n'y a
    # simplement aucun pipeline.
    - name: Le projet du lab dans la forge
      ansible.builtin.include_tasks: ../_commun/depot.yaml
      vars:
        branche_source: "starter/lab-08"
        exiger_absence_pipeline: false
        effacer_pipelines: false
        attendre_pipeline_depart: true
        adapter_registre_local: true

    # Un déclencheur ou une planification laissés par un passage précédent
    # feraient démarrer le lab à moitié fait : l'apprenant doit les créer
    # lui-même. On repart donc d'un projet qui n'en a aucun, et on le vérifie.
    - name: Aucun declencheur ni planification ne doit preexister
      ansible.builtin.shell: |
        set -o pipefail
        JETON=$(cat /etc/dsoxlab/jeton-api)
        API="$URL/api/v4"
        H="PRIVATE-TOKEN: $JETON"
        ID=$(curl -sS --header "$H" "$API/projects/root%2F$PROJET" | jq -r '.id // empty')
        test -n "$ID"

        for T in $(curl -sS --header "$H" "$API/projects/$ID/triggers" | jq -r '.[]?.id'); do
          curl -sS --header "$H" --request DELETE "$API/projects/$ID/triggers/$T" >/dev/null
        done
        for S in $(curl -sS --header "$H" "$API/projects/$ID/pipeline_schedules" | jq -r '.[]?.id'); do
          curl -sS --header "$H" --request DELETE "$API/projects/$ID/pipeline_schedules/$S" >/dev/null
        done

        RESTE_T=$(curl -sS --header "$H" "$API/projects/$ID/triggers" | jq '[.[]?] | length')
        RESTE_S=$(curl -sS --header "$H" "$API/projects/$ID/pipeline_schedules" | jq '[.[]?] | length')
        if [ "$RESTE_T" -ne 0 ] || [ "$RESTE_S" -ne 0 ]; then
          echo "il reste $RESTE_T declencheur(s) et $RESTE_S planification(s)"
          exit 1
        fi
      args:
        executable: /bin/bash
      environment:
        PROJET: "{{ projet }}"
        URL: "{{ gitlab_url }}"
      changed_when: true
