# Lab gl-12-accelerer-le-pipeline. Les champs marqués REQUIS sont exigés par le validator :
# sans eux, le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: gl-12-accelerer-le-pipeline              # REQUIS
title: "A cache that is never found, and jobs that wait for nothing"   # REQUIS
level: c3                     # REQUIS
description: "The pipeline works and wastes time twice: its cache key changes on every commit, so the cache is never read, and its jobs queue behind stages that do not concern them. Graded on a restored cache and on two jobs overlapping in time."
skills:                       # REQUIS, non vide
  - gitlab-ci
  - cache
  - dag
  - performance
distros:                      # REQUIS, non vide
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/pipeline-cicd/gitlab/labs/lab-12-accelerer-pipeline/   # REQUIS, http(s)
lab_type: lab
estimated_time: 35m
# Certification GitLab Certified CI/CD Associate. Objectifs releves sur
# university.gitlab.com le 2026-10-22, recopies verbatim :
# - objectif 1 : « Create and configure .gitlab-ci.yml files with proper YAML
#   syntax, variables, artifacts, and caching strategies »
# - objectif 5 : « Diagnose pipeline failures and optimize performance using
#   best practices and troubleshooting techniques »
# - objectif 6 : « pipeline development with stages, jobs, and DAG
#   architectures »
# Cle de cache instable, donc cache jamais relu, et jobs qui attendent une
# etape qui ne les concerne pas : needs, donc DAG.
certification_tags:
  - gl-cicd-associate

runtime:
  type: vm
  # L'apprenant ouvre lui-même sa session : une forge se manipule depuis sa
  # propre machine, pas depuis un shell injecté.
  session: local
  targets:                    # REQUIS pour vm, non vide
    - name: gitlab
      host: gitlab-1.lab      # doit exister dans meta.yml: infra.hosts[]
      label_en: "Ubuntu 24.04, GitLab CE and its runner"
      label_fr: "Ubuntu 24.04, GitLab CE et son runner"
  default: gitlab
validation:
  functional: true
  persistence_after_reboot: false
