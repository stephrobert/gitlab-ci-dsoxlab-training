# Lab gl-11-diagnostiquer-un-job-bloque. Les champs marqués REQUIS sont exigés par le validator :
# sans eux, le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: gl-11-diagnostiquer-un-job-bloque        # REQUIS
title: "Two silent failures: nothing runs, nothing complains"   # REQUIS
level: c2                     # REQUIS
description: "Push, and nothing happens: no pipeline at all. Fix that, and a job hangs forever without failing. Diagnose two failures that produce no error message, then prove the pipeline runs. Graded on the pipeline left on the forge."
skills:                       # REQUIS, non vide
  - gitlab-ci
  - debug
  - runners
  - workflow
distros:                      # REQUIS, non vide
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/pipeline-cicd/gitlab/fondamentaux/debug-pending/   # REQUIS, http(s)
lab_type: lab
estimated_time: 35m
# Certification GitLab Certified CI/CD Associate. Objectifs releves sur
# university.gitlab.com le 2026-10-22, recopies verbatim :
# - objectif 5 : « Diagnose pipeline failures and optimize performance using
#   best practices and troubleshooting techniques »
# - objectif 2 : « Install, configure, and manage GitLab Runners across
#   different environments and executors »
# Deux pannes sans message : aucun pipeline ne nait, puis un job reste en
# attente d'un runner dont les tags ne correspondent pas.
certification_tags:
  - gl-cicd-associate

runtime:
  type: vm
  # L'apprenant ouvre lui-même sa session : une forge se manipule depuis sa
  # propre machine, pas depuis un shell injecté.
  session: local
  targets:                    # REQUIS pour vm, non vide
    - name: gitlab
      host: gitlab-1.lab      # doit exister dans meta.yml: infra.hosts[]
      label_en: "Ubuntu 24.04, GitLab CE and its runner"
      label_fr: "Ubuntu 24.04, GitLab CE et son runner"
  default: gitlab
validation:
  functional: true
  persistence_after_reboot: false
