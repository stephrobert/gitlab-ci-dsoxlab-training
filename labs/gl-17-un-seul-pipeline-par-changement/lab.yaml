# Lab gl-17-un-seul-pipeline-par-changement. Les champs marqués REQUIS sont exigés par le
# validator : sans eux, le lab est refusé, ou pire, disparaît du catalogue sans un mot.
id: gl-17-un-seul-pipeline-par-changement    # REQUIS
title: "One change, one pipeline"            # REQUIS
level: c3                     # REQUIS
description: "A branch carrying an open merge request runs two pipelines for the same commit: the machine does everything twice and the merge request shows two results. Make the workflow merge-request-first, and keep the right one. Graded by counting the pipelines on one commit."
skills:                       # REQUIS, non vide
  - gitlab-ci
  - workflow
  - rules
  - merge-requests
distros:                      # REQUIS, non vide
  - ubuntu24
doc_url: https://www.stephane-robert.info/docs/pipeline-cicd/gitlab/industrialisation/workflows/   # REQUIS, http(s)
lab_type: lab
estimated_time: 35m
runtime:
  type: vm
  # L'apprenant ouvre lui-même sa session : une forge se manipule depuis sa
  # propre machine, pas depuis un shell injecté.
  session: local
  targets:                    # REQUIS pour vm, non vide
    - name: gitlab
      host: gitlab-1.lab      # doit exister dans meta.yml: infra.hosts[]
      label_en: "Ubuntu 24.04, GitLab CE and its runner"
      label_fr: "Ubuntu 24.04, GitLab CE et son runner"
  default: gitlab
validation:
  functional: true
  persistence_after_reboot: false
