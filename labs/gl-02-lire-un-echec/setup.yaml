---
# Joué par `dsoxlab run` : il pose la situation du scénario, un pipeline
# ROUGE dont l'apprenant doit lire les messages.
#
# Le socle installe GitLab CE et son runner, et il est idempotent : après le
# lab 01, il ne réinstalle rien. `_commun/depot.yaml` pose le projet et son
# contenu, avec la branche de départ pour seule variable.
- name: Socle commun du catalogue
  ansible.builtin.import_playbook: ../_commun/socle.yaml

- name: Preparer le lab gl-02-lire-un-echec
  hosts: lab_target
  become: true
  gather_facts: false
  vars:
    projet: "pipeline-craft"
    gitlab_url: "http://gitlab-1.lab"
    travail: "/opt/dsoxlab/gl-02"
    bundle_cible: "/opt/dsoxlab/pipeline-craft.bundle"

  tasks:
    # `starter/lab-02` porte le pipeline du lab 01 ET les trois bugs que
    # l'apprenant doit diagnostiquer. Trois réglages distinguent ce lab du
    # précédent, et chacun a sa raison :
    #
    #   - `exiger_absence_pipeline: false` : le dépôt porte au contraire un
    #     `.gitlab-ci.yml`, c'est lui qui est cassé ;
    #   - `effacer_pipelines: false` : le pipeline rouge né du push EST le
    #     sujet du lab. L'effacer priverait l'apprenant de ce qu'il doit lire,
    #     et Auto DevOps ne peut pas s'y inviter puisqu'un fichier existe ;
    #   - `attendre_pipeline_depart: true` : l'apprenant doit trouver un
    #     pipeline terminé, pas un pipeline en cours dont le journal est
    #     incomplet.
    - name: Le projet du lab dans la forge
      ansible.builtin.include_tasks: ../_commun/depot.yaml
      vars:
        branche_source: "starter/lab-02"
        exiger_absence_pipeline: false
        effacer_pipelines: false
        attendre_pipeline_depart: true
