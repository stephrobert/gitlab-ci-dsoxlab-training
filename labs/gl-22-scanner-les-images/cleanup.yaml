---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il remet la situation du
# scénario, pour que le lab se rejoue à l'identique. Tout le travail vit dans
# `_commun/nettoyer.yaml` : les images du registre partent d'abord (GitLab
# refuse de supprimer un projet qui en porte), puis le projet, puis la copie de
# travail, qui emporte aussi la note de l'équipe sécurité. Le cache de Trivy
# reste : ce n'est pas un état du lab, et il évite de retélécharger la base de
# vulnérabilités.
- name: Nettoyer le lab gl-22-scanner-les-images
  hosts: lab_target
  become: true
  gather_facts: false
  vars:
    projet: "pipeline-craft"
    gitlab_url: "http://gitlab-1.lab"
    travail: "/opt/dsoxlab/gl-22"

  tasks:
    - name: Le projet et la copie de travail partent
      ansible.builtin.include_tasks: ../_commun/nettoyer.yaml
