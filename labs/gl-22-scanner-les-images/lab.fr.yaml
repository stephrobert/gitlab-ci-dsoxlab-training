title: Scanner l'image, et cesser de livrer une faille critique
description: "Un pipeline construit et publie son image sans que personne ne la regarde, et une vulnérabilité critique est partie en production. Ajoutez un job qui scanne l'image publiée avec Trivy, conservez son rapport JSON en artefact même quand le job échoue, faites échouer le pipeline sur une vulnérabilité critique avant tout déploiement, puis écartez dans `.trivyignore` le seul finding trié par l'équipe sécurité, avec sa raison écrite à côté. Noté sur ce que la forge a vu : le rapport conservé, l'image du registre au tag du commit, un pipeline réellement échoué sans aucun déploiement, et une exception unique et justifiée, absente du dernier rapport."
