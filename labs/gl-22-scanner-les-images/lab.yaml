id: gl-22-scanner-les-images
title: Scan the image, and stop shipping a critical flaw
level: l1
description: "A pipeline builds and publishes its image without anyone looking at it, and a critical vulnerability has reached production. Add a job that scans the published image with Trivy, keep its JSON report as an artifact even when the job fails, make the pipeline fail on a critical vulnerability before any deployment, then rule out in `.trivyignore` the single finding the security team triaged, with its reason written next to it. Graded on what the forge saw: the report kept, the registry image at the commit tag, a pipeline that really failed with no deployment at all, and a single justified exception, absent from the latest report."
skills:
- gitlab-ci
- sec.vuln.manage
- trivy
- container-scanning
distros:
- ubuntu24
doc_url: https://www.stephane-robert.info/docs/pipeline-cicd/gitlab/securite/supply-chain/
lab_type: lab
estimated_time: 40m
# Certification GitLab Certified CI/CD Associate. Objectifs releves sur
# university.gitlab.com le 2026-10-22, recopies verbatim :
# - objectif 4 : « Implement security scanning tools within CI/CD workflows and
#   interpret vulnerability reports »
# - objectif 3 : « Build and manage container images and packages using
#   GitLab's integrated registries »
# Scan de l'image publiee, rapport garde meme en echec, pipeline rouge sur une
# vulnerabilite critique et exception unique justifiee.
certification_tags:
  - gl-cicd-associate

runtime:
  type: vm
  session: local
  targets:
  - name: gitlab
    host: gitlab-1.lab
    label_en: Ubuntu 24.04, GitLab CE and its runner
    label_fr: Ubuntu 24.04, GitLab CE et son runner
  default: gitlab
validation:
  functional: true
  persistence_after_reboot: false
