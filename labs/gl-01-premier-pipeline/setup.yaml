---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit, à savoir le dépôt fil rouge dans la forge et AUCUN
# pipeline.
#
# Le socle commun fait le gros du travail (GitLab CE, son runner, le jeton
# d'administration) et il est idempotent : au second lab, il ne réinstalle
# rien. `_commun/depot.yaml` pose ensuite le projet et son contenu, avec la
# branche de départ pour seule variable. C'est pour cela que les deux sont
# inclus et non recopiés : une correction faite ici profite aux 19 labs.
- name: Socle commun du catalogue
  ansible.builtin.import_playbook: ../_commun/socle.yaml

- name: Preparer le lab gl-01-premier-pipeline
  hosts: lab_target
  become: true
  gather_facts: false
  vars:
    projet: "pipeline-craft"
    gitlab_url: "http://gitlab-1.lab"
    travail: "/opt/dsoxlab/gl-01"
    bundle_cible: "/opt/dsoxlab/pipeline-craft.bundle"

  tasks:
    # Le lab 01 part de `main`, l'état du dépôt fil rouge AVANT tout pipeline,
    # et `exiger_absence_pipeline` le vérifie dans la forge : l'absence de
    # `.gitlab-ci.yml` est tout le sujet de ce lab.
    - name: Le projet du lab dans la forge
      ansible.builtin.include_tasks: ../_commun/depot.yaml
      vars:
        branche_source: "main"
        exiger_absence_pipeline: true
