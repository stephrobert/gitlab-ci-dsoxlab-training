title: Protéger ce qui fusionne, et ce qui déploie
description: "Un pipeline vert déploie en production depuis un projet qui ne porte aucun verrou : n'importe qui peut pousser sur main, créer un tag de release et fusionner sans pipeline vert. Protégez la branche main et les tags de release, exigez un pipeline vert et des discussions résolues avant toute fusion, puis prouvez que les verrous laissent passer un déploiement légitime. Noté sur les réglages que la forge porte, lus dans son API, jamais sur un fichier. La règle d'approbation et l'environnement protégé sont des fonctions Premium : elles n'entrent pas dans le lab."
