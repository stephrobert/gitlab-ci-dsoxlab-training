# Les hooks de ce catalogue. Ils mesurent ce qu'une relecture ne voit pas.
#
# `pass_filenames: false` partout : ces contrôles portent sur le dépôt entier,
# pas sur les fichiers d'un commit. Un lab retiré du `meta.yml` casse le
# catalogue sans qu'aucun fichier du commit ne le montre.

# Trois choses qu'aucun hook ne doit NI lire NI réécrire.
#
# `solution/` porte les vingt et une solutions chiffrées par ansible-vault :
# c'est du chiffré, pas du source, et `end-of-file-fixer` comme
# `trailing-whitespace` en corrompraient la charge de façon irréversible.
#
# `labs/_commun/depot/` porte le BUNDLE GIT du dépôt fil rouge, un binaire.
# Mesuré le 2026-10-22 en ajoutant le hook ruff à ce dépôt : le premier
# passage de `trailing-whitespace` et `end-of-file-fixer` lui a retiré
# 12 octets, de 67 018 à 67 006. `git bundle verify` l'acceptait encore, ce qui
# est pire qu'un échec franc : le jour où la coupe tombe ailleurs, ce sont les
# dix-neuf labs qui perdent leur dépôt de départ sans qu'un contrôle le dise.
#
# Les tests des labs, eux, ne sont PAS exclus, bien que le même passage ait
# retiré sa ligne finale au test du lab 09. Les exclure de tous les hooks les
# retirerait aussi de `ruff`, alors que la CI les lint de son côté : le job
# « parité pre-commit » cesserait de prouver ce qu'il annonce. Une ligne vide
# en fin de fichier n'est pas une modification de ce qu'un test mesure, et la
# normalisation ne se produit qu'une fois.
exclude: |
  (?x)^(
    solution/
    |labs/_commun/depot/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # LICENSE est EXCLUE des deux hooks d'espaces. Le texte d'une licence se
      # reconnaît au caractère près : GitHub l'identifie en le comparant, et
      # `end-of-file-fixer` lui retirait sa ligne finale à chaque passage.
      # Mesuré sur sept catalogues neufs : `git status` affichait `M LICENSE`
      # sans qu'aucun humain y ait touché.
      - id: trailing-whitespace
        exclude: '^LICENSE$'
      - id: end-of-file-fixer
        exclude: '^LICENSE$'
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: contrat-valide
        name: le contrat du catalogue est valide
        # `entry: dsoxlab …` emploierait le moteur du PATH, c'est-à-dire ce qui
        # traîne sur la machine du contributeur. `uvx` avec une borne prend une
        # version DÉCLARÉE, la même qu'en CI, et les guillemets sont
        # nécessaires : sans eux, la ligne recopiée dans un terminal crée un
        # fichier nommé `=0.5.0` par redirection.
        entry: uvx 'dsoxlab>=0.5.5' validate-structure
        language: system
        pass_filenames: false

      # Le verrou décrit ce qui s'installe, et c'est lui que les scanners de
      # vulnérabilités lisent. Un verrou qui dérive de son `pyproject.toml` ne
      # verrouille plus rien.
      #
      # PREMIER GESTE après la création du catalogue : `uv lock`. Le socle ne
      # peut pas produire ce fichier, puisque le résoudre demande le réseau ;
      # ce hook échouera donc jusqu'à ce que vous l'ayez lancé, et il le dira.
      - id: verrou-a-jour
        name: uv.lock décrit bien le pyproject
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock)$'

      - id: garde-fous
        name: les garde-fous du dépôt passent
        entry: uv run --with pytest --with pyyaml pytest tests/ -q
        language: system
        pass_filenames: false

      # La règle d'écriture du projet interdit le tiret cadratin en français :
      # il se remplace par la ponctuation qui dit son rôle. Mesuré sur un
      # catalogue sans ce hook : 51 `lab.fr.yaml`, 172 README de labs et 86
      # scénarios en portaient un.
      # Un import oublie dans un test passe `pytest --collect-only` et casse
      # a l'appel, dix minutes plus tard, sur une VM. Mesure le 2026-10-22 sur
      # le lab 12 : « NameError: name 're' is not defined ».
      - id: tests-des-labs-complets
        name: les tests des labs ont tous leurs noms
        entry: python3 scripts/check-tests.py
        language: system
        pass_filenames: false

      # Un playbook refuse AU CHARGEMENT ne tourne pas du tout, et le message
      # ne nomme pas la ligne fautive. Deux causes connues : `${#VAR}`, que
      # Jinja lit comme un commentaire ouvert, et une apostrophe dans un
      # commentaire de script embarque.
      - id: playbooks-se-chargent
        name: tous les playbooks se chargent
        # `--with pyyaml`, comme le hook `garde-fous` juste au-dessus. Sans
        # lui, le script tourne avec l'interpreteur du systeme, ou pyyaml n'est
        # pas installe : il ne peut plus distinguer un playbook d'un fichier de
        # taches, les passe tous a `--syntax-check`, et DEUX fichiers de taches
        # sont alors refuses avec « 'ansible.builtin.file' is not a valid
        # attribute for a Play ». Mesure le 2026-10-22 : le hook echouait, le
        # meme script passait en ligne de commande.
        entry: uv run --with pyyaml python3 scripts/check-playbooks.py
        language: system
        pass_filenames: false

      - id: pas-de-tiret-cadratin
        name: ni emoji ni tiret cadratin dans ce que lit l'apprenant
        entry: python3 tests/outils/pas_de_tiret_cadratin.py
        language: system
        pass_filenames: false

      # Un verdict ne se commite pas avec ce qu'il mesure. Vécu le 2026-10-22 :
      # une correction de `labs/_commun/` et les verdicts qu'elle rendait
      # caducs sont partis dans le même commit, et le contrôle de péremption,
      # qui compare les dates de commit, n'avait plus rien à comparer. Les
      # vingt et un verdicts sont restés VALIDE alors qu'un défaut du commun
      # les avait tous périmés.
      - id: verdicts-et-commun-separes
        name: les verdicts ne sont pas commités avec ce qu'ils mesurent
        entry: python3 tests/outils/verdicts_et_commun_separes.py
        language: system
        pass_filenames: false

      # La CI joue `uvx ruff check .` : sans ce hook, une erreur de lint part
      # en CI au lieu d'être arrêtée au commit. Les catalogues frères le
      # portent tous.
      #
      # `--force-exclude` n'est pas une précaution : sans lui, l'exclusion
      # déclarée dans le pyproject est IGNORÉE pour tout fichier passé en
      # argument, et pre-commit passe justement les fichiers en argument.
      - id: ruff
        name: ruff (lint du python des labs et des scripts)
        entry: uvx ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Le garde-fou ci-dessus est lui-meme eprouve, dans les DEUX sens :
      # quatorze cas, ceux qu'il doit refuser et ceux qu'il doit laisser
      # passer. Un garde-fou qui refuserait aussi les commits legitimes se
      # contourne au bout de deux jours, et ne controle alors plus rien.
      - id: garde-fou-des-verdicts-eprouve
        name: le garde-fou des verdicts juge dans les deux sens
        entry: uv run --no-project --with pytest --with pyyaml pytest tests/test_verdicts_et_commun_separes.py -q
        language: system
        pass_filenames: false
        always_run: true
