# Catalogue gitlab-ci-dsoxlab-training, décrit par le contrat v1 de dsoxlab.
#
# `repo.id` sert de clé pour l'état local de ce catalogue : le changer
# déplace ces emplacements.
schema_version: 1

repo:
  id: gitlab-ci-dsoxlab-training
  category: gitlab-ci
  title: GitLab CI/CD
  description: |
    Write a GitLab CI/CD pipeline, read its failures, make data flow between
    jobs, take secrets out of the code, control when it runs, publish to the
    registry, then industrialise it: factor the YAML, speed it up with a DAG
    and matrices, orchestrate several pipelines and make it reliable.

    Every lab runs against a real GitLab CE instance and its runner, and is
    graded on the state of the pipeline it leaves behind, read from the API,
    never on the commands typed. The application under test is the FastAPI
    project `pipeline-craft`, pushed into the lab forge.

# Une VM unique porte GitLab CE et son runner, sur le modèle de
# `cicd-dsoxlab-training` qui fait tenir Forgejo et son runner sur un seul
# hôte. Le dimensionnement n'est pas une estimation : il reprend celui du lab
# d'installation `~/Projets/lab-gitlab`, qui déploie GitLab CE sur KVM et
# attend jusqu'à 600 secondes que l'instance réponde. GitLab CE est deux fois
# plus gourmand que Forgejo, et c'est le prix du vrai moteur : rien d'autre ne
# permet de noter un `environment:`, un artefact côté serveur ou un registre.
infra:
  provider: kvm
  network: lab-gitlab-ci
  cidr: 10.10.95.0/24
  hosts:
    - name: gitlab-1.lab
      distro: ubuntu24
      role: forge
      ram_mb: 8192
      vcpu: 4
      disk_gb: 50

# Les sections suivent les QUATRE NIVEAUX du parcours du site
# (`src/data/parcours/gitlab-ci.yaml`), et non les deux blocs du plan
# historique de `pipeline-craft`. Raison : le catalogue doit se lire comme la
# formation qu'il valide, sinon on tient deux découpages en parallèle, ce que
# la règle K du socle interdit.
#
# La section `securiser` a ete COMBLEE le 2026-10-23 : elle portait le trou du
# niveau C4 trouve par l'audit du 2026-10-21, et elle compte desormais sept labs
# attestes VALIDE, gl-20 a gl-25 plus l'epreuve gl-ep3. Ce commentaire disait
# encore « section VIDE » au-dessus de ses propres labs : un audit l'a releve le
# 2026-10-23. Un fichier contractuel qui decrit un etat revolu est pire qu'un
# fichier muet, puisqu'on le lit sans le verifier.
sections:
  - id: ecrire
    title: "Write a pipeline and read its failures"
    description: >-
      A first green pipeline, a failure read in its log and fixed, the right
      image and the runner that picks the job, artifacts and cache, secrets out
      of the code, and control over when each job runs.
    labs:
      - gl-01-premier-pipeline
      - gl-02-lire-un-echec
      - gl-03-images-et-runners
      - gl-04-artifacts-et-cache
      - gl-05-sortir-les-secrets
      - gl-06-controler-execution
      - gl-07-valider-avant-de-pousser
      - gl-ep1-un-pipeline-qui-dit-vrai

  - id: livrer
    title: "Deliver"
    description: >-
      Trigger a pipeline by schedule, by API and from another project, publish
      an image to the registry, read quality reports where the reviewer looks,
      and diagnose a job stuck in pending or silently skipped.
    labs:
      - gl-08-declencher-autrement
      - gl-09-publier-au-registre
      - gl-10-rapports-de-qualite
      - gl-11-diagnostiquer-un-job-bloque
      - gl-ep2-une-livraison-tracable

  - id: industrialiser
    title: "Industrialise"
    description: >-
      Speed the pipeline up with a DAG and a cache that is really reused,
      factor the YAML with extends and anchors, externalise templates into
      included files, test on a matrix, orchestrate a generated child
      pipeline, stop running everything twice for one change, make the whole
      thing reliable without hiding failures, then rebuild all of it from a
      specification alone.
    labs:
      - gl-12-accelerer-le-pipeline
      - gl-13-factoriser-le-yaml
      - gl-14-externaliser-les-jobs
      - gl-15-une-matrice-de-tests
      - gl-16-un-pipeline-enfant
      - gl-17-un-seul-pipeline-par-changement
      - gl-18-fiabiliser-sans-masquer
      - gl-19-reconstruire-tout-le-pipeline
      - gl-ep4-un-pipeline-a-industrialiser

  - id: securiser
    title: "Secure and tool"
    description: >-
      Replay an attack on a pipeline and block it, turn the scanners on and
      read their reports, sign an image and refuse the ones that are not,
      protect what merges and what deploys, harden the runner, and audit your
      own chain without a paid licence.
    labs:
      - gl-21-activer-les-scanners
      - gl-22-scanner-les-images
      - gl-23-supply-chain-tracable
      - gl-20-secrets-avances
      - gl-24-proteger-les-merges
      - gl-25-durcir-le-pipeline
      - gl-ep3-un-pipeline-qu-on-peut-auditer

